name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to release (e.g. v0.1.0); created on the current commit if missing"
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test

      - name: Rust tests
        working-directory: src-tauri
        run: cargo test

      - name: Build portable exe
        run: npm run tauri build

      - name: Package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist-release | Out-Null
          $exe = "dist-release/Window-Switcher-$env:TAG-x64.exe"
          Copy-Item src-tauri/target/release/window-switcher.exe $exe
          $hash = (Get-FileHash $exe -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $exe -Leaf)" | Out-File -Encoding ascii "$exe.sha256"

      - name: Create GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create $env:TAG dist-release/* `
            --target $env:GITHUB_SHA `
            --title "Window Switcher $env:TAG" `
            --generate-notes
